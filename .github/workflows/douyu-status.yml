name: 更新直播状态
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "pages.js"
      - "scripts/douyu-status.js"
      - ".github/workflows/douyu-status.yml"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/douyu-status.js
      - name: 推送到 status 分支
        run: |
          mkdir -p /tmp/status-out
          cp status.json /tmp/status-out/status.json
          cd /tmp/status-out
          git init -b status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -m "更新直播状态"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" status:status
