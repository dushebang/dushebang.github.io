<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B站视频切片 · 读书班的数据站</title>
<meta name="description" content="B 站视频切片合集">
<link rel="stylesheet" href="../shared/style.css">
<style>
  body { padding: 34px 0 64px; }

  .backlink {
    display: inline-flex;
    align-items: center;
    margin-bottom: 22px;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--card);
    color: var(--text-2);
    text-decoration: none;
    font-size: 0.82rem;
    font-weight: 600;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: color 0.15s, border-color 0.15s;
  }
  .backlink:hover { color: var(--accent); border-color: var(--border-hover); }

  .page-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .page-head h1 { margin: 0; font-size: 1.5rem; letter-spacing: 0.5px; }
  .count { color: var(--text-2); font-size: 0.85rem; }

  .clips {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 18px;
    margin-top: 22px;
  }

  .clip { display: block; color: inherit; text-decoration: none; }

  .clip-cover {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .clip:hover .clip-cover {
    transform: translateY(-3px);
    border-color: var(--border-hover);
    box-shadow: 0 12px 30px -14px var(--glow);
  }

  .clip-title {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-top: 8px;
    font-size: 0.92rem;
    line-height: 1.5;
    transition: color 0.15s;
  }
  .clip:hover .clip-title { color: var(--accent); }

  .empty { padding: 72px 0; text-align: center; color: var(--text-2); }
</style>
<script>
  // 主题：跟随数据站的深浅色设置
  (function () {
    var t = null;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
</head>
<body>
<div class="container">
  <a class="backlink" href="../index.html">← 返回数据站</a>

  <div class="page-head">
    <h1>B站视频切片</h1>
    <span class="count" id="count"></span>
  </div>

  <section class="clips" id="clips"></section>
  <p class="empty" id="empty-hint" hidden>还没有视频。发来 BV 号即可自动收录。</p>
</div>

<script src="videos.js"></script>
<script>
  (function () {
    var data = window.CLIP_DATA || { videos: [] };
    var videos = Array.isArray(data.videos) ? data.videos : [];

    document.getElementById("count").textContent =
      videos.length ? "共 " + videos.length + " 个视频" : "";

    var grid = document.getElementById("clips");
    if (!videos.length) {
      document.getElementById("empty-hint").hidden = false;
      return;
    }

    videos.forEach(function (v) {
      var a = document.createElement("a");
      a.className = "clip";
      a.href = "https://www.bilibili.com/video/" + v.bvid + "/";
      a.target = "_blank";
      a.rel = "noopener";

      if (v.cover) {
        var img = document.createElement("img");
        img.className = "clip-cover";
        img.loading = "lazy";
        img.referrerPolicy = "no-referrer";
        img.alt = v.title || v.bvid;
        img.src = v.cover;
        a.appendChild(img);
      }

      var span = document.createElement("span");
      span.className = "clip-title";
      span.textContent = v.title || v.bvid;
      a.appendChild(span);

      grid.appendChild(a);
    });
  })();
</script>
</body>
</html>
