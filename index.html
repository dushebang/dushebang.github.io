<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dushebang 的数据站</title>
  <meta name="description" content="汇总我制作的各种统计页面，持续更新">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='17' width='5' height='11' rx='1.5' fill='%236366f1'/%3E%3Crect x='13.5' y='11' width='5' height='17' rx='1.5' fill='%23a855f7'/%3E%3Crect x='23' y='5' width='5' height='23' rx='1.5' fill='%2322d3ee'/%3E%3C/svg%3E">
  <meta name="theme-color" id="theme-color" content="#f6f7fb">
  <link rel="stylesheet" href="shared/style.css">
  <script>
    // 尽早套用主题，避免页面闪烁
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>

  <div class="aurora" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>

  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换深浅色" title="切换深浅色">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>

  <header class="hero">
    <div class="container">
      <div class="logo" id="site-logo">D</div>
      <h1 id="site-title">dushebang 的数据站</h1>
      <p class="subtitle" id="site-subtitle">汇总我制作的各种统计页面，持续更新</p>
      <div class="chips" id="meta-chips"></div>
    </div>
  </header>

  <main class="container">
    <div class="filters" id="filters"></div>
    <section class="grid" id="page-grid"></section>
    <p class="empty" id="empty-hint" hidden>还没有页面，在 <code>pages.js</code> 里添加第一条记录吧。</p>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> dushebang · 托管于 GitHub Pages</p>
    </div>
  </footer>

  <script src="pages.js"></script>
  <script>
    (function () {
      var root = document.documentElement;

      // ---- 深浅色切换 ----
      var THEME_COLORS = { light: "#f6f7fb", dark: "#0a0b10" };
      var themeMeta = document.getElementById("theme-color");
      function syncThemeMeta() {
        themeMeta.setAttribute(
          "content",
          THEME_COLORS[root.getAttribute("data-theme")] || THEME_COLORS.light
        );
      }
      syncThemeMeta();
      document.getElementById("theme-toggle").addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch (e) {}
        syncThemeMeta();
      });

      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      // ---- 清单数据 ----
      var data = window.SITE_DATA || { site: {}, pages: [] };
      var site = data.site || {};
      var pages = Array.isArray(data.pages) ? data.pages : [];

      var title = site.title || "数据站";
      document.title = title;
      document.getElementById("site-title").textContent = title;
      var sub = document.getElementById("site-subtitle");
      if (site.subtitle) { sub.textContent = site.subtitle; } else { sub.hidden = true; }
      document.getElementById("site-logo").textContent =
        (site.logo || title.trim().charAt(0) || "D").toUpperCase();

      document.getElementById("year").textContent = new Date().getFullYear();

      // ---- 顶部信息小徽章 ----
      var chips = document.getElementById("meta-chips");
      if (pages.length) {
        var chipCount = document.createElement("span");
        chipCount.className = "chip";
        chipCount.innerHTML = "已收录 <b>" + pages.length + "</b> 个页面";
        chips.appendChild(chipCount);

        var latest = "";
        pages.forEach(function (p) { if (p.updated && p.updated > latest) { latest = p.updated; } });
        if (latest) {
          var chipUpd = document.createElement("span");
          chipUpd.className = "chip";
          chipUpd.innerHTML = "最近更新 <b>" + esc(latest) + "</b>";
          chips.appendChild(chipUpd);
        }
      }

      var grid = document.getElementById("page-grid");
      if (!pages.length) {
        document.getElementById("empty-hint").hidden = false;
        return;
      }

      // ---- 标签筛选按钮（从清单里自动收集） ----
      var allTags = [];
      pages.forEach(function (p) {
        (p.tags || []).forEach(function (t) {
          if (allTags.indexOf(t) === -1) { allTags.push(t); }
        });
      });

      var cards = [];
      if (allTags.length) {
        var filterBar = document.getElementById("filters");
        var btns = [];
        function addFilter(label, tag) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "filter" + (tag === null ? " active" : "");
          b.textContent = label;
          b.addEventListener("click", function () {
            btns.forEach(function (x) { x.classList.remove("active"); });
            b.classList.add("active");
            cards.forEach(function (c) {
              c.el.classList.toggle("hide", tag !== null && (c.tags || []).indexOf(tag) === -1);
            });
          });
          btns.push(b);
          filterBar.appendChild(b);
        }
        addFilter("全部", null);
        allTags.forEach(function (t) { addFilter(t, t); });
      }

      // ---- 渲染卡片 ----
      pages.forEach(function (p, i) {
        var isLink = !!p.url;
        var card = document.createElement(isLink ? "a" : "div");
        card.className = "card" + (isLink ? "" : " card-soon");
        card.style.setProperty("--i", i);
        if (isLink) {
          card.href = p.url;
          if (/^https?:\/\//.test(p.url)) { card.target = "_blank"; card.rel = "noopener"; }
        }

        var iconText = (p.icon || p.title || "?").trim().charAt(0).toUpperCase();
        var gClass = "g" + ((i % 4) + 1);

        var right = isLink
          ? '<svg class="card-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M9 7h8v8"/></svg>'
          : '<span class="badge">即将上线</span>';

        var tagsHtml = (p.tags || []).map(function (t) {
          return '<span class="tag">' + esc(t) + "</span>";
        }).join("");

        card.innerHTML =
          '<div class="card-head">' +
            '<span class="card-icon ' + gClass + '">' + esc(iconText) + "</span>" +
            '<h2 class="card-title">' + esc(p.title || "未命名页面") + "</h2>" +
            right +
          "</div>" +
          (p.description ? '<p class="card-desc">' + esc(p.description) + "</p>" : "") +
          '<div class="card-meta">' +
            '<span class="tags">' + tagsHtml + "</span>" +
            (p.updated ? '<span class="card-date">更新于 ' + esc(p.updated) + "</span>" : "") +
          "</div>";

        grid.appendChild(card);
        cards.push({ el: card, tags: p.tags || [] });
      });
    })();
  </script>

</body>
</html>
