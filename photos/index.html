<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一些照片 · 读书班的数据站</title>
<meta name="description" content="一些照片">
<link rel="stylesheet" href="../shared/style.css">
<style>
  body { padding: 34px 0 64px; }

  /* 相册页比首页稍宽 */
  .container { max-width: 1500px; }

  .backlink {
    display: inline-flex;
    align-items: center;
    margin-bottom: 22px;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--card);
    color: var(--text-2);
    text-decoration: none;
    font-size: 0.82rem;
    font-weight: 600;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: color 0.15s, border-color 0.15s;
  }
  .backlink:hover { color: var(--accent); border-color: var(--border-hover); }

  .page-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .page-head h1 { margin: 0; font-size: 1.5rem; letter-spacing: 0.5px; }
  .count { color: var(--text-2); font-size: 0.85rem; }

  .photos {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
    margin-top: 22px;
  }
  .photo {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    cursor: zoom-in;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .photo:hover {
    transform: translateY(-3px);
    border-color: var(--border-hover);
    box-shadow: 0 12px 30px -14px var(--glow);
  }

  /* ---------- 全屏查看器 ---------- */
  .lb {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(6, 8, 14, 0.93);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .lb.open { display: flex; }

  .lb-img {
    max-width: 92vw;
    max-height: 84vh;
    border-radius: 8px;
    box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.8);
    user-select: none;
  }

  .lb-top {
    position: absolute;
    top: 16px;
    left: 20px;
    right: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    color: #e8eaf0;
  }
  .lb-counter { font-size: 0.85rem; color: #b9bfcc; letter-spacing: 1px; }
  .lb-actions { display: flex; gap: 8px; }
  .lb-btn {
    display: inline-flex;
    align-items: center;
    padding: 7px 14px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    color: #eef1f6;
    font-size: 0.82rem;
    font-weight: 600;
    font-family: inherit;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .lb-btn:hover { background: rgba(255, 255, 255, 0.16); border-color: rgba(255, 255, 255, 0.4); }

  .lb-nav {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .lb-arrow {
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    color: #eef1f6;
    font-size: 1.2rem;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.15s;
  }
  .lb-arrow:hover { background: rgba(255, 255, 255, 0.18); border-color: rgba(255, 255, 255, 0.45); transform: translateY(-1px); }
  .lb-arrow:disabled { opacity: 0.3; cursor: default; transform: none; }
</style>
<script>
  // 主题：跟随数据站的深浅色设置
  (function () {
    var t = null;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
</head>
<body>
<div class="container">
  <a class="backlink" href="../index.html">← 返回数据站</a>

  <div class="page-head">
    <h1>一些照片</h1>
    <span class="count" id="count"></span>
  </div>

  <section class="photos" id="photos"></section>
</div>

<div class="lb" id="lb">
  <div class="lb-top">
    <span class="lb-counter" id="lb-counter"></span>
    <div class="lb-actions">
      <a class="lb-btn" id="lb-download" href="#" download>下载原图</a>
      <button class="lb-btn" id="lb-close" type="button">关闭</button>
    </div>
  </div>
  <img class="lb-img" id="lb-img" src="" alt="">
  <div class="lb-nav">
    <button class="lb-arrow" id="lb-prev" type="button" aria-label="上一张" title="上一张（↑）">↑</button>
    <button class="lb-arrow" id="lb-next" type="button" aria-label="下一张" title="下一张（↓）">↓</button>
  </div>
</div>

<script src="photos.js"></script>
<script>
  (function () {
    var data = window.PHOTO_DATA || { photos: [] };
    var photos = Array.isArray(data.photos) ? data.photos : [];
    var current = 0;

    document.getElementById("count").textContent =
      photos.length ? "共 " + photos.length + " 张" : "";

    var grid = document.getElementById("photos");
    var lb = document.getElementById("lb");
    var lbImg = document.getElementById("lb-img");
    var lbCounter = document.getElementById("lb-counter");
    var lbDownload = document.getElementById("lb-download");
    var lbPrev = document.getElementById("lb-prev");
    var lbNext = document.getElementById("lb-next");

    photos.forEach(function (src, i) {
      var img = document.createElement("img");
      img.className = "photo";
      img.loading = "lazy";
      img.src = src;
      img.alt = "照片 " + (i + 1);
      img.addEventListener("click", function () { openAt(i); });
      grid.appendChild(img);
    });

    function render() {
      lbImg.src = photos[current];
      lbCounter.textContent = (current + 1) + " / " + photos.length;
      lbDownload.setAttribute("href", photos[current]);
      lbPrev.disabled = current === 0;
      lbNext.disabled = current === photos.length - 1;
      if (photos[current + 1]) { var n1 = new Image(); n1.src = photos[current + 1]; }
      if (photos[current - 1]) { var n2 = new Image(); n2.src = photos[current - 1]; }
    }

    function openAt(i) {
      current = i;
      render();
      lb.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function close() {
      lb.classList.remove("open");
      lbImg.src = "";
      document.body.style.overflow = "";
    }

    function step(d) {
      var next = current + d;
      if (next < 0 || next >= photos.length) { return; }
      current = next;
      render();
    }

    document.getElementById("lb-close").addEventListener("click", close);
    lbPrev.addEventListener("click", function () { step(-1); });
    lbNext.addEventListener("click", function () { step(1); });
    lb.addEventListener("click", function (e) {
      if (e.target === lb) { close(); }
    });

    document.addEventListener("keydown", function (e) {
      if (!lb.classList.contains("open")) { return; }
      if (e.key === "Escape") { close(); }
      else if (e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
      else if (e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); step(1); }
    });
  })();
</script>
</body>
</html>
